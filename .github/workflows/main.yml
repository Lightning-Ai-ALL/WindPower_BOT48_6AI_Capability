name: Lightning AI Auto-Patch Pipeline

on:
  push:
    branches: ["main", "dev"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-layer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify repository does not contain private core
        shell: bash
        run: |
          set -e

          echo "Checking for private source files..."

          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|\.py$'; then
            echo "ERROR: Private or sensitive files detected."
            exit 1
          fi

          echo "OK: public repository boundary verified."

      - name: Check for obvious hard-coded secrets
        shell: bash
        run: |
          set -e

          if git grep -n -E \
            'sk-[A-Za-z0-9_-]+|PRIVATE_KEY[[:space:]]*=|API_KEY[[:space:]]*=' \
            -- ':!*.md' ':!*.yml' ':!*.yaml'; then
            echo "ERROR: Possible hard-coded secret detected."
            exit 1
          fi

          echo "OK: no obvious hard-coded secrets detected."

      - name: Verify frontend exists
        shell: bash
        run: |
          test -f frontend/index.html
          test -f frontend/app.js
          echo "OK: frontend structure verified."

      - name: Verify workflow structure
        shell: bash
        run: |
          test -d .github/workflows
          echo "OK: workflow structure verified."

      - name: NONPHYSICAL simulation boundary
        run: |
          echo "======================================"
          echo " Lightning AI Storm Core Simulation"
          echo " MODE: NONPHYSICAL"
          echo " REAL DEVICE CONTROL: DISABLED"
          echo " GRID CONTROL: DISABLED"
          echo " WEATHER CONTROL: DISABLED"
          echo "======================================"

      - name: Final verification
        run: |
          echo "Public layer verification completed."
          echo "Storm Core remains outside the public repository."
# .github/workflows/main.yml (擴充部分)

name: AI 機械派系 - 合體演練

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '演練模式 (SIM / NONPHYSICAL)'
        required: true
        default: 'NONPHYSICAL'
      wind_speed:
        description: '風速 (m/s)'
        required: true
        default: '25'

jobs:
  combiner-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: 觸發合體協議 (Command Core → 外星球)
        env:
          API_URL: ${{ secrets.WINDPOWER_API_URL }}
          API_KEY: ${{ secrets.WINDPOWER_API_KEY }}
        run: |
          echo "🧠 Command AI: 開始拆解任務..."
          echo "🛡️ Guardian AI: 安全檢查通過 (無實體控制)。"
          echo "🌪️ Storm AI: 計算風暴模擬中..."
          echo "📦 Dispatch AI: 產生資源建議..."
          echo "🔗 Combiner: 聚合所有 Agent 輸出，準備發送至外星球。"

          curl --fail-with-body \
            -X POST "$API_URL/api/combiner/run" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
                  \"mode\": \"${{ github.event.inputs.mode }}\",
                  \"wind_speed\": ${{ github.event.inputs.wind_speed }},
                  \"agent_chain\": [\"Guardian\", \"Storm\", \"Dispatch\", \"Reviewer\"],
                  \"combine\": true
                }" \
            -o combined_result.json

          echo "✅ 合體完成。結果已回傳至地球端 (此 Workflow)。"

      - name: 儲存合體結果 (Archive AI)
        uses: actions/upload-artifact@v4
        with:
          name: combined-ai-report
          path: combined_result.json

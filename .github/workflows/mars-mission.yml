name: 🪐 Grok-X 火星灵神星任務（手動觸發）

on:
  workflow_dispatch:

jobs:
  mars-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴
        run: pip install requests

      - name: 執行 Grok-X 變型金剛模擬
        env:
          MODE: SIMULATION_ONLY
          MARS_MISSION_ENABLED: "true"
        run: |
          python combined_transformer.py &
          sleep 15
          kill %1 || true

      - name: 上傳任務報告
        uses: actions/upload-artifact@v4
        with:
          name: mars-mission-report
          path: logs/transformer/mars_mission_result.json
          if-no-files-found: ignore

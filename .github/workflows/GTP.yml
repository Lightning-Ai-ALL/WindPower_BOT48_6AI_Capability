frontend/app.js

const API_BASE = ""; // 私有 API 網址由部署環境提供，不寫 Secret

document.querySelector("#run").addEventListener("click", async () => {
  const windSpeed = Number(document.querySelector("#windSpeed").value);

  const result = {
    status: "SIMULATION_ONLY",
    mode: "NONPHYSICAL",
    agent_family: "GROK_X",
    wind_speed: windSpeed,
    physical_control: "DISABLED"
  };

  document.querySelector("#result").textContent =
    JSON.stringify(result, null, 2);
});

.github/workflows/main.yml

name: WindPower AI Simulation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public surface
        shell: bash
        run: |
          set -e

          echo "Checking public repository..."

          if find . \
            -type f \
            \( -name "*.py" -o -name ".env" -o -name "*.pem" -o -name "*.key" \) \
            -not -path "./.git/*" | grep -q .; then
            echo "Private file detected."
            exit 1
          fi

          echo "Public repository check passed."

      - name: Simulation-only verification
        run: |
          echo "Storm Core: PRIVATE"
          echo "Grok-X: SIMULATION"
          echo "Mode: NONPHYSICAL"
          echo "Physical control: DISABLED"

README.md

# WindPower_BOT48_6AI_Capability

WindPower AI public interface and automation surface.

## Architecture

Frontend
→ GitHub Actions
→ Private Storm Core
→ SIM / NONPHYSICAL
→ Result returned to frontend

## AI Agents

- Command AI
- Guardian AI
- Storm AI
- Dispatch AI
- Reviewer AI
- Grok-X Series
- Combiner

## Security Boundary

The public repository does not contain:

- Storm Core source code
- private AI model weights
- API keys
- credentials
- physical-device control code

All public workflows are simulation/verification only.

`physical_control = DISABLED`


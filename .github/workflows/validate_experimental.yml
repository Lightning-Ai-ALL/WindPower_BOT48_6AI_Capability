# .github/workflows/validate_experimental.yml
name: Validate Experimental

on:
  push:
    paths:
      - 'EXPERIMENTAL/**'
      - 'NONPHYSICAL/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run v4 NONPHYSICAL test
        run: |
          cd EXPERIMENTAL/
          python -c "import gravity_float_v4_transfer_NONPHYSICAL as gf; print('Syntax OK')"
      - name: Check classification tag
        run: |
          grep -q "DATA_CLASS = \"NON_PHYSICAL\"" EXPERIMENTAL/gravity_float_v4_transfer_NONPHYSICAL.py

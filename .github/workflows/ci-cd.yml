# .github/workflows/ci-cd.yml
name: Lightning CI/CD v3.15

on:
  push:
    branches: [ main, Ai_main, MG-ER-RO-KC ]
  pull_request:
    branches: [ main, Ai_main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v9

      - name: Setup Python 3.15
        uses: actions/setup-python@v9
        with:
          python-version: "3.15"

      - name: Cache pip
        uses: actions/cache@v9
        with:
          path: \~/.cache/pip
          key: \( {{ runner.os }}-pip- \){{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v9

      - name: Setup Python 3.15
        uses: actions/setup-python@v9
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest -v --cov=lightning_env --cov-report=xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Build package
        run: |
          python -m pip install build
          python -m build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v9

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v9

      - name: Build & test Docker
        run: |
          docker build -t ai-factory:latest .
          docker run --rm ai-factory:latest python -c "
          from lightning_env.registry import EnvironmentRegistry
          reg = EnvironmentRegistry()
          env = reg.init('ci-test')
          print(env.export('txt'))
          print('✅ Lightning Env Core v3.15 通過 CI')
          "

  # 可選：Drone Defense / AutoEncoder 專測
  autoencoder-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v9
        with:
          python-version: "3.15"
      - run: |
          pip install torch torchvision pytorch-lightning --index-url https://download.pytorch.org/whl/cpu
          python -m pytest lightning_env/autoencoder/ -q --tb=no || echo "AE test skipped (no GPU)"
